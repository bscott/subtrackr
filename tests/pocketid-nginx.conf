events {}

http {
    server {
        listen 8443 ssl;
        server_name pocket-id.test;

        ssl_certificate /etc/nginx/test-tls/server.crt;
        ssl_certificate_key /etc/nginx/test-tls/server.key;

        location / {
            proxy_pass http://pocket-id-internal:1411;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
